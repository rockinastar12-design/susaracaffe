<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Susara Caffe | Professional Billing</title>
    <style>
        :root {
            --primary: #5d4037;
            --highlight: #f4a261;
            --bg: #faf9f6;
            --dark: #1a1a1a;
            --success: #2a9d8f;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--bg); padding-bottom: 250px; }
        
        header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        
        /* History Styling */
        .history-box { background: white; padding: 15px; border-radius: 10px; margin-top: 30px; border: 1px solid #ddd; }
        .search-controls { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-controls input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .history-list { font-size: 0.85rem; max-height: 500px; overflow-y: auto; }
        .history-item { border-bottom: 2px solid #f0f0f0; padding: 12px 0; }
        .history-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
        .history-details { background: #fdfbf7; padding: 8px; border-radius: 5px; font-size: 0.75rem; color: #555; border-left: 3px solid var(--highlight); }
        .reprint-btn { background: #555; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 10px; cursor: pointer; margin-top: 5px; }

        /* Menu Styling */
        .table-input { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; }
        .table-input input { width: 60px; padding: 8px; font-weight: bold; text-align: center; border: 2px solid var(--highlight); border-radius: 5px; }
        .section-title { color: var(--primary); border-bottom: 2px solid var(--highlight); margin: 25px 0 10px; font-weight: 800; text-transform: uppercase; font-size: 0.85rem; }
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .item-card { background: white; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
        .add-btn { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .momo-table { width: 100%; border-collapse: collapse; background: white; font-size: 0.75rem; border: 1px solid #ddd; }
        .momo-table th { background: var(--primary); color: white; padding: 10px 5px; }
        .momo-table td { padding: 8px 3px; text-align: center; border: 1px solid #eee; }
        .momo-btn { background: #f8f1ef; border: 1px solid #ddd; padding: 6px; border-radius: 4px; cursor: pointer; width: 100%; }

        #cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--dark); color: white; padding: 20px; display: none; flex-direction: column; gap: 10px; z-index: 999; }
        .cart-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .print-btn { grid-column: span 2; background: var(--success); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        @media print {
            @page { size: 58mm auto; margin: 0; }
            body * { visibility: hidden; }
            #thermal-wrapper, #thermal-wrapper * { visibility: visible; }
            #thermal-wrapper { display: block !important; position: absolute; left: 0; top: 0; width: 54mm; padding: 0; font-family: 'Courier New', monospace; font-size: 11px; color: black; line-height: 1.1; }
            .receipt-sec { padding: 2mm; }
            .cut-line { border-top: 1px dashed black; margin: 10px 0; text-align: center; }
            .r-line { display: flex; justify-content: space-between; }
            .r-center { text-align: center; }
            .r-dash { border-top: 1px dashed black; margin: 4px 0; }
        }
    </style>
</head>
<body>

<div id="thermal-wrapper">
    <div class="receipt-sec">
        <div class="r-center"><strong style="font-size:14px;">SUSARA CAFFE</strong><br>Tea Estate, Baglung<div class="r-dash"></div><strong>BILL</strong></div>
        <div class="r-line"><span>Table:</span> <span class="rt-table"></span></div>
        <div class="r-line"><span>Date:</span> <span class="rt-date"></span></div>
        <div class="r-dash"></div>
        <div class="rt-items"></div>
        <div class="r-dash"></div>
        <div class="r-line" style="font-weight:bold;"><span>TOTAL:</span><span>Rs.<span class="rt-total"></span></span></div>
    </div>
    <div class="cut-line"></div>
    <div class="receipt-sec">
        <div class="r-center"><strong>KITCHEN ORDER (KOT)</strong><div class="r-dash"></div></div>
        <div class="r-line"><span>TBL:</span> <strong style="font-size:16px;" class="rt-table"></strong></div>
        <div class="rt-items-kot"></div>
        <br><br>
    </div>
</div>

<div class="no-print">
    <header><h1>SUSARA CAFFE</h1></header>
    <div class="container">
        <div class="table-input">
            <strong>TABLE NO:</strong>
            <input type="number" id="tbl-num" value="1">
        </div>
        <div id="menu-container"></div>
        <div class="history-box">
            <h3 style="margin-top:0;">Daily Sales Record</h3>
            <div class="search-controls">
                <input type="date" id="search-date" onchange="filterHistory()">
                <button onclick="exportData()" style="padding:5px; font-size:10px;">CSV Report</button>
            </div>
            <div id="daily-total" style="font-weight:bold; color:var(--success); margin-bottom:10px;"></div>
            <div class="history-list" id="history-content"></div>
        </div>
    </div>
</div>

<div id="cart-bar" class="no-print">
    <div class="cart-summary"><span>Current Total:</span><span>Rs. <span id="total-amt">0</span></span></div>
    <div class="cart-btns">
        <button class="print-btn" onclick="saveAndPrint()">FINISH & PRINT BILL</button>
        <button onclick="clearCart()" style="background:#e63946; color:white; border:none; border-radius:10px; cursor:pointer;">CLEAR</button>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzRxZBB0eTcAmrasLfP3VUmbr-PUwoN4M8VTh7YGPA7J5uGk7ISs0N1kD_awqautRCMuw/exec';

    const fullMenu = {
        "Coffee (Hot)": [{n: "Ristretto", p: 100}, {n: "Espresso", p: 100}, {n: "Americano", p: 130}, {n: "Cappuccino", p: 150}, {n: "Café Latte", p: 180}, {n: "Honey Latte", p: 200}, {n: "Mocaccino", p: 180}, {n: "Hot Chocolate", p: 200}],
        "Tea & Others": [{n: "Lemon Tea", p: 60}, {n: "Green Tea", p: 50}, {n: "Black Tea", p: 50}, {n: "Milk Tea", p: 40}],
        "Breakfast": [{n: "Chana Anda", p: 120}, {n: "Samosa Tarkari", p: 120}, {n: "Lachha Paratha", p: 110}, {n: "Puri Tarkari", p: 120}, {n: "Bread Omelette", p: 120}],
        "Main Course": [{n: "Veg Chowmein", p: 100}, {n: "Chicken Chowmein", p: 180}, {n: "Veg Thukpa", p: 180}, {n: "Chicken Thukpa", p: 230}],
        "Burgers & Rolls": [{n: "Veg Burger", p: 200}, {n: "Chicken Burger", p: 250}, {n: "Chicken Katti Roll", p: 250}],
        "Snacks": [{n: "Chicken Chilly", p: 300}, {n: "Chicken Fry", p: 300}, {n: "French Fry", p: 200}, {n: "Peanut Sadeko", p: 150}]
    };

    const momoData = [{t: "Veg", s: 150, f: 200, j: 210, c: 250}, {t: "Chicken", s: 180, f: 250, j: 280, c: 280}, {t: "Banana", s: 150, f: 200, j: 210, c: 210}];
    
    let cart = []; let total = 0;
    let transactions = JSON.parse(localStorage.getItem('susara_db')) || [];

    function initMenu() {
        const container = document.getElementById('menu-container');
        container.innerHTML = `<div class="section-title">MOMO SPECIALS</div><table class="momo-table"><thead><tr><th>TYPE</th><th>STM</th><th>FRY</th><th>JHL</th><th>CHL</th></tr></thead><tbody id="momo-body"></tbody></table>`;
        momoData.forEach(m => {
            document.getElementById('momo-body').innerHTML += `<tr><td><b>${m.t}</b></td><td><button class="momo-btn" onclick="add('${m.t} Stm', ${m.s})">${m.s}</button></td><td><button class="momo-btn" onclick="add('${m.t} Fry', ${m.f})">${m.f}</button></td><td><button class="momo-btn" onclick="add('${m.t} Jhl', ${m.j})">${m.j}</button></td><td><button class="momo-btn" onclick="add('${m.t} Chl', ${m.c})">${m.c}</button></td></tr>`;
        });
        for (let cat in fullMenu) {
            container.innerHTML += `<div class="section-title">${cat}</div><div class="menu-grid" id="${cat.replace(/\s/g, '')}"></div>`;
            fullMenu[cat].forEach(i => {
                document.getElementById(cat.replace(/\s/g, '')).innerHTML += `<div class="item-card"><div><h4>${i.n}</h4><p>Rs.${i.p}</p></div><button class="add-btn" onclick="add('${i.n}', ${i.p})">ADD</button></div>`;
            });
        }
        filterHistory();
    }

    function add(n, p) { cart.push({n, p}); total += p; document.getElementById('cart-bar').style.display = 'flex'; document.getElementById('total-amt').innerText = total; }
    function clearCart() { cart = []; total = 0; document.getElementById('cart-bar').style.display = 'none'; }

    function sendDataToGoogle(entry) {
        const payload = {
            date: entry.date,
            fullTime: entry.fullTime,
            table: entry.table,
            items: entry.items.map(i => `${i.n} (Rs.${i.p})`).join(", "),
            amount: entry.amount
        };
        fetch(scriptURL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .catch(err => console.error('Sync Error:', err));
    }

    function saveAndPrint() {
        const entry = { id: Date.now(), date: new Date().toISOString().split('T')[0], fullTime: new Date().toLocaleString(), table: document.getElementById('tbl-num').value, items: [...cart], amount: total };
        transactions.push(entry);
        localStorage.setItem('susara_db', JSON.stringify(transactions));
        sendDataToGoogle(entry);
        renderThermal(entry);
        window.print();
        clearCart();
        filterHistory();
    }

    function reprint(id) {
        const entry = transactions.find(t => t.id === id);
        if (entry) { renderThermal(entry); window.print(); }
    }

    function renderThermal(data) {
        document.querySelectorAll('.rt-table').forEach(s => s.innerText = data.table);
        document.querySelectorAll('.rt-date').forEach(s => s.innerText = data.fullTime);
        document.querySelectorAll('.rt-total').forEach(s => s.innerText = data.amount);
        document.querySelector('.rt-items').innerHTML = data.items.map(i => `<div class="r-line"><span>${i.n}</span><span>${i.p}</span></div>`).join("");
        document.querySelector('.rt-items-kot').innerHTML = data.items.map(i => `<div>• ${i.n}</div>`).join("");
    }

    function filterHistory() {
        const searchDate = document.getElementById('search-date').value;
        const list = document.getElementById('history-content');
        const displayTotal = document.getElementById('daily-total');
        list.innerHTML = "";
        let filtered = searchDate ? transactions.filter(t => t.date === searchDate) : transactions;
        let daySum = 0;

        filtered.slice().reverse().forEach(t => {
            daySum += t.amount;
            const itemsWithPrices = t.items.map(i => `<div>${i.n} - Rs.${i.p}</div>`).join("");
            list.innerHTML += `
                <div class="history-item">
                    <div class="history-header">
                        <div><strong>Tbl ${t.table}</strong> | <small>${t.fullTime.split(',')[1]}</small></div>
                        <div style="text-align:right;">
                            <div style="font-weight:bold; color:var(--primary);">Rs.${t.amount}</div>
                        </div>
                    </div>
                    <div class="history-details">${itemsWithPrices}</div>
                    <button class="reprint-btn" onclick="reprint(${t.id})">REPRINT BILL</button>
                </div>`;
        });
        displayTotal.innerText = searchDate ? `Sales for ${searchDate}: Rs. ${daySum}` : `Total Record: Rs. ${daySum}`;
    }

    function exportData() {
        let csv = "ID,Date,Time,Table,Items_Breakdown,Total\n";
        transactions.forEach(t => {
            let itemStr = t.items.map(i => `${i.n}(${i.p})`).join(" | ");
            csv += `${t.id},${t.date},${t.fullTime.split(',')[1]},${t.table},"${itemStr}",${t.amount}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = Object.assign(document.createElement('a'), { href: window.URL.createObjectURL(blob), download: 'Susara_Detailed_Sales.csv' });
        a.click();
    }

    window.onload = initMenu;
</script>
</body>
</html>
