<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Susara Cafe POS</title>

<style>
:root{
--brand:#2c3e50;
--accent:#e67e22;
--bg:#f4f6f7;
--success:#27ae60;
--danger:#e74c3c;
}

body{
margin:0;
font-family:sans-serif;
background:var(--bg);
padding-bottom:130px;
}

nav{
background:var(--brand);
color:white;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

input{
width:50px;
text-align:center;
}

.container{padding:10px;}

.section{
font-weight:bold;
margin-top:15px;
color:#555;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.item{
background:white;
padding:10px;
border-radius:10px;
border:1px solid #ddd;
}

.item:active{transform:scale(0.97);}

.price{color:var(--accent);font-weight:bold;}

.cart{
position:fixed;
bottom:0;
width:100%;
background:var(--brand);
color:white;
padding:12px;
display:none;
}

button{
border:none;
padding:10px;
border-radius:8px;
}

.print{background:var(--success);color:white;width:65%;}
.clear{background:var(--danger);color:white;width:30%;}

@media print{
body *{visibility:hidden;}
#print,#print *{visibility:visible;}
#print{
position:absolute;
left:0;
top:0;
width:58mm;
font-size:12px;
font-family:monospace;
}
}
</style>
</head>

<body>

<nav>
<b>SUSARA CAFE</b>
Table <input id="table" value="1">
</nav>

<div class="container" id="menu"></div>

<div class="cart" id="cartBox">
<div id="cartItems"></div>
<b>Total: Rs <span id="total">0</span></b><br><br>

<button class="print" onclick="printBill()">PRINT</button>
<button class="clear" onclick="clearCart()">CLEAR</button>
</div>

<pre id="print"></pre>

<script>

const scriptURL="https://script.google.com/macros/s/AKfycbybEjjxx2qUylSok_Npg0h4VRZ9LRxRrmX0DoC-wYRXakjMP0Kiwot3vcpGlgAF3g-xuQ/exec";

/* FULL MENU */
const menuData = {
"Special":[
{n:"Gajar ko Aalu Paratha",p:100},
{n:"Fapar ko Jhol Momo",p:230}
],

"Coffee":[
{n:"Espresso",p:100},{n:"Doppio",p:150},{n:"Americano",p:130},
{n:"Cappuccino",p:150},{n:"Cafe Latte",p:200},{n:"Honey Latte",p:220},
{n:"Lungo",p:160},{n:"Hot Choc",p:200},{n:"Flat White",p:180},
{n:"Hot Lemon Honey",p:100},{n:"Lemon Tea",p:60},
{n:"Black Tea",p:50},{n:"Green Tea",p:50}
],

"Breakfast":[
{n:"Chana Anda",p:120},{n:"Samosa Tarkari",p:120},
{n:"Lachha Paratha",p:110},{n:"Puri Tarkari",p:120},
{n:"Chana Tarkari",p:80},{n:"Bread Omlet",p:120},
{n:"Veg Sandwich",p:150},{n:"Egg Sandwich",p:190},
{n:"Chicken Sandwich",p:220},{n:"Mix Sandwich",p:250}
],

"Chowmein":[
{n:"Veg Chowmein",p:120},{n:"Chicken Chowmein",p:180},
{n:"Egg Chowmein",p:150},{n:"Mix Chowmein",p:250}
],

"Thukpa":[
{n:"Veg Thukpa",p:180},{n:"Chicken Thukpa",p:230},
{n:"Egg Thukpa",p:210},{n:"Mix Thukpa",p:250}
],

"Combo":[
{n:"Veg Combo",p:200},{n:"Chicken Combo",p:250},{n:"Mix Combo",p:280}
],

"Lassi":[
{n:"Plain Lassi",p:120},{n:"Banana Lassi",p:150},{n:"Mix Lassi",p:180}
]
};

const momoList=[
{t:"Chicken Momo",s:150,f:200,j:220,c:250},
{t:"Veg Momo",s:130,f:160,j:190,c:220},
{t:"Buff Momo",s:200,f:250,j:280,c:300},
{t:"Kera Veg Momo",s:150,f:200,j:220,c:250}
];

let cart=[];
let total=0;

/* RENDER */
function render(){
let html="";

/* MOMO */
html+=`<div class="section">MOMO</div><div class="grid">`;
momoList.forEach(m=>{
html+=`
<div class="item">
<b>${m.t}</b><br>
<button onclick="add('${m.t} Steam',${m.s})">${m.s}</button>
<button onclick="add('${m.t} Fry',${m.f})">${m.f}</button>
<button onclick="add('${m.t} Jhol',${m.j})">${m.j}</button>
<button onclick="add('${m.t} Chilly',${m.c})">${m.c}</button>
</div>`;
});
html+=`</div>`;

/* MENU */
for(let cat in menuData){
html+=`<div class="section">${cat}</div><div class="grid">`;

menuData[cat].forEach(i=>{
html+=`
<div class="item" onclick="add('${i.n}',${i.p})">
${i.n}<br>
<span class="price">Rs ${i.p}</span>
</div>`;
});

html+="</div>";
}

document.getElementById("menu").innerHTML=html;
}

/* ADD */
function add(n,p){
cart.push({n,p});
total+=p;

document.getElementById("cartBox").style.display="block";

document.getElementById("cartItems").innerHTML=
cart.map(i=>`<div>${i.n} - Rs ${i.p}</div>`).join("");

document.getElementById("total").innerText=total;
}

/* CLEAR */
function clearCart(){
cart=[];
total=0;
document.getElementById("cartBox").style.display="none";
}

/* PRINT + SAVE */
function printBill(){
if(cart.length==0)return;

let table=document.getElementById("table").value;
let items="";
cart.forEach(i=>{
items+=`${i.n} ${i.p}\n`;
});

/* SAVE TO SHEET */
fetch(scriptURL,{
method:"POST",
mode:"no-cors",
body:JSON.stringify({
table:table,
items:items,
total:total,
date:new Date().toLocaleString()
})
});

/* PRINT */
document.getElementById("print").innerText=
`SUSARA CAFE
Table: ${table}
----------------
${items}
----------------
TOTAL: Rs ${total}
`;

window.print();
clearCart();
}

render();

</script>

</body>
</html>
