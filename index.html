<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUSARA POS FINAL FIX</title>

<style>
body{margin:0;font-family:sans-serif;background:#f4f6f8;padding-bottom:120px;}

nav{
background:#2c3e50;
color:white;
padding:12px;
display:flex;
justify-content:space-between;
}

.container{padding:10px;}

.section{margin-top:15px;font-weight:bold;color:#555;}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

.card{
background:white;
padding:10px;
border-radius:8px;
border:1px solid #ddd;
}

.card:active{background:#eee;}

.cart{
position:fixed;
bottom:0;
width:100%;
background:#2c3e50;
color:white;
padding:10px;
display:none;
}

button{padding:10px;border:none;border-radius:5px;}

.print{background:#27ae60;color:white;width:70%;}
.clear{background:red;color:white;width:25%;}

/* LOGIN FIX */
#loginScreen{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:#2c3e50;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
z-index:9999;
}

input{
padding:10px;
margin:5px;
border-radius:5px;
border:none;
}

/* PRINT */
@media print{
body *{visibility:hidden;}
#printArea,#printArea *{visibility:visible;}
#printArea{position:absolute;top:0;left:0;width:58mm;font-size:11px;}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
<h2>SUSARA POS LOGIN</h2>
<input id="u" placeholder="User ID">
<input id="p" type="password" placeholder="Password">
<button onclick="doLogin()">LOGIN</button>
</div>

<nav>
<div>SUSARA CAFFE</div>
<div>TBL <input id="tbl" type="number" value="1" style="width:40px"></div>
</nav>

<div class="container">
<div id="menu"></div>
</div>

<div class="cart" id="cart">
<div id="items"></div>
<div>Total Rs.<span id="total">0</span></div>
<button class="print" onclick="save()">PRINT</button>
<button class="clear" onclick="clearCart()">CLEAR</button>
</div>

<!-- PRINT AREA -->
<div id="printArea">
<center><b>SUSARA CAFFE</b></center>
<div>Bill: <span id="billno"></span></div>
<div>Table: <span id="ptbl"></span></div>
<hr>
<div id="pitems"></div>
<hr>
<div>Total Rs.<span id="ptotal"></span></div>
</div>

<script>

const URL="https://script.google.com/macros/s/AKfycbybEjjxx2qUylSok_Npg0h4VRZ9LRxRrmX0DoC-wYRXakjMP0Kiwot3vcpGlgAF3g-xuQ/exec";

/* MENU */
const menu={
"Special":[{n:"Gajar ko Aalu Paratha",p:100},{n:"Fapar ko Jhol Momo",p:230}],
"Coffee":[{n:"Espresso",p:100},{n:"Doppio",p:150},{n:"Americano",p:130},{n:"Cappuccino",p:150},{n:"Cafe Latte",p:200},{n:"Honey Latte",p:220},{n:"Lungo",p:160},{n:"Hot Choc",p:200},{n:"Flat White",p:180},{n:"Hot Lemon Honey",p:100},{n:"Lemon Tea",p:60},{n:"Black Tea",p:50},{n:"Green Tea",p:50}],
"Breakfast":[{n:"Chana Anda",p:120},{n:"Samosa Tarkari",p:120},{n:"Lachha Paratha",p:110},{n:"Puri Tarkari",p:120},{n:"Chana Tarkari",p:80},{n:"Bread Omlet",p:120},{n:"Veg Sandwich",p:150},{n:"Egg Sandwich",p:190},{n:"Chicken Sandwich",p:220},{n:"Mix Sandwich",p:250}],
"Chowmein":[{n:"Veg Chowmein",p:120},{n:"Chicken Chowmein",p:180},{n:"Egg Chowmein",p:150},{n:"Mix Chowmein",p:250}],
"Thukpa":[{n:"Veg Thukpa",p:180},{n:"Chicken Thukpa",p:230},{n:"Egg Thukpa",p:210},{n:"Mix Thukpa",p:250}],
"Combo":[{n:"Veg Combo",p:200},{n:"Chicken Combo",p:250},{n:"Mix Combo",p:280}],
"Lassi":[{n:"Plain Lassi",p:120},{n:"Banana Lassi",p:150},{n:"Mix Lassi",p:180}]
};

let cart=[];
let total=0;

/* LOGIN FIX */
function doLogin(){
let u=document.getElementById("u").value;
let p=document.getElementById("p").value;

if(u==="admin" && p==="1234"){
document.getElementById("loginScreen").style.display="none";
render();
}
else{
alert("Wrong ID or Password");
}
}

/* RENDER MENU */
function render(){
let h="";
for(let c in menu){
h+=`<div class="section">${c}</div><div class="grid">`;
menu[c].forEach(i=>{
h+=`<div class="card" onclick="add('${i.n}',${i.p})">${i.n}<br>Rs.${i.p}</div>`;
});
h+="</div>";
}
document.getElementById("menu").innerHTML=h;
}

/* ADD ITEM */
function add(n,p){
cart.push({n,p});
total+=p;
document.getElementById("cart").style.display="block";
document.getElementById("items").innerHTML=cart.map(i=>i.n+" "+i.p).join("<br>");
document.getElementById("total").innerText=total;
}

/* CLEAR */
function clearCart(){
cart=[];
total=0;
document.getElementById("cart").style.display="none";
}

/* SAVE + PRINT */
function save(){
if(cart.length==0)return;

let bill=localStorage.getItem("bill")||0;
bill++;
localStorage.setItem("bill",bill);

document.getElementById("billno").innerText=bill;
document.getElementById("ptbl").innerText=document.getElementById("tbl").value;
document.getElementById("ptotal").innerText=total;

document.getElementById("pitems").innerHTML=
cart.map(i=>i.n+" - "+i.p).join("<br>");

fetch(URL,{
method:"POST",
mode:"no-cors",
body:JSON.stringify({
date:new Date().toISOString().split("T")[0],
table:document.getElementById("tbl").value,
items:cart.map(i=>i.n).join(","),
amount:total
})
});

window.print();
clearCart();
}

</script>

</body>
</html>
